name: WindowsBuild
on: 
  workflow_dispatch:
  
  workflow_call:

jobs:
  Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Exclude build dir from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "D:\a" -ErrorAction SilentlyContinue

      - name: Install Libraries (with retry)
        shell: pwsh
        run: |
          haxelib setup C:\haxelib
          haxelib install hmm --quiet
          $ok = $false
          for ($i=0; $i -lt 6 -and -not $ok; $i++) {
            Write-Host "=== hmm install attempt $($i+1) ==="
            haxelib run hmm install
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            else { Start-Sleep -Seconds 8 }
          }
          if (-not $ok) { Write-Error "hmm install failed after retries"; exit 1 }

      - name: Extract current version
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content Project.xml -Raw
          if ($content -match 'build-number="([^"]*)"') {
              $CURRENT_VERSION = $matches[1]
              echo "current_version=$CURRENT_VERSION" >> $env:GITHUB_OUTPUT
              Write-Output "ok: $CURRENT_VERSION"
          } else {
              Write-Error "build-number not found"
              exit 1
          }

      - name: Enable Windows long path support
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force

      - name: Compile
        shell: pwsh
        run: |
          $COMMIT_SHA = (git rev-parse --short HEAD)
          $CURRENT_VERSION = "${{ steps.get_version.outputs.current_version }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $NEW_VERSION = $CURRENT_VERSION -replace "-dev", "-$COMMIT_SHA"
            haxelib run lime build windows -Dlegacy_gc_compare -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          } else {
            haxelib run lime build windows -Dlegacy_gc_compare -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          }
          
      - name: Create Windows zip package
        shell: pwsh
        run: | 
          cd export\legacy-gc\windows\bin
          Compress-Archive -Path * -DestinationPath windows.zip

      - name: Upload Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@main
        with:
          name: windowsBuild
          path: export\legacy-gc\windows\bin\windows.zip
          if-no-files-found: error
